<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Bot Audit Loop</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F5;--paper:#fff;--ink:#17201F;--ink2:#4A5553;--mute:#7A8582;--line:#DDE3E0;--soft:#EEF2EF;--accent:#0F6E63;--accent2:#C5542D;--ok:#2E7D4F;--warn:#B7791F;--bad:#B23A3A;
  --body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body)}
header{background:var(--ink);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header b{font-size:16px}header nav{display:flex;gap:4px;margin-left:10px}header nav a{color:#CFD8D5;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:13.5px}
header nav a.on{background:rgba(255,255,255,.14);color:#fff}header .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:#9FB0AB}
main{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
h2{font-size:18px;margin:22px 0 10px}h3{font-size:14px;margin:0 0 6px;color:var(--ink2);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.tile s{text-decoration:none;color:var(--mute);font-size:12.5px}
.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.tile.acc b{color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.pill.fatal{background:#F8E1E1;color:var(--bad)}.pill.nf{background:#DFF0E6;color:var(--ok)}.pill.sr{background:#E0F0EE;color:var(--accent)}.pill.w{background:#FBEFD9;color:var(--warn)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.btn.p{background:var(--accent);color:#fff;border-color:transparent}.btn.d{background:var(--bad);color:#fff;border-color:transparent}.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5}
pre{font-family:var(--mono);font-size:12px;background:#F1F4F2;padding:10px;border-radius:8px;overflow:auto;white-space:pre-wrap;max-height:420px;margin:8px 0}
pre .add{color:var(--ok)}pre .del{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:var(--mute);font-size:12.5px}
.bar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.trail{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.trail span{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.trail span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;font-weight:600}.toast.on{opacity:1}
.t{white-space:pre-wrap;font-size:13px;line-height:1.5;background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:360px;overflow:auto}
</style></head><body>
<header><b>Voice Bot Audit Loop</b><nav id="nav"></nav><span class="r" id="hdr"></span></header>
<main id="m"></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(p,o);if(!r.ok)throw new Error(await r.text());return r.json()}
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const VIEWS=['overview','calls','causes','fixes','experiments','queues','prompt'];let view=location.hash.slice(2)||'overview';
function nav(){$('#nav').innerHTML=VIEWS.map(v=>`<a href="#/${v}" class="${v===view?'on':''}">${v}</a>`).join('')}
const grade=g=>g==='Fatal'?'<span class="pill fatal">Fatal</span>':g==='Non-Fatal'?'<span class="pill nf">Non-Fatal</span>':'<span class="pill">—</span>';
const diffHtml=d=>esc(d).split('\n').map(l=>l.startsWith('+')&&!l.startsWith('+++')?`<span class="add">${l}</span>`:l.startsWith('-')&&!l.startsWith('---')?`<span class="del">${l}</span>`:l).join('\n');

async function overview(){const s=await api('/audit/summary');const a=s.agreement||{};
  const ttf=(s.time_to_fix||[]).map(x=>x.decided&&x.found?(new Date(x.decided)-new Date(x.found))/60000:null).filter(x=>x!=null);
  return `<div class="tiles">
   <div class="tile acc"><s>Calls audited</s><b>${s.audited_pct}%</b><s>${s.audited} of ${s.calls} · sample today ≈ 3%</s></div>
   <div class="tile ${a.kappa>=0.75?'ok':'bad'}"><s>Agreement with humans</s><b>${a.kappa!=null?'κ '+a.kappa:'—'}</b><s>${a.n?`n=${a.n} · Fatal recall ${a.fatal_recall} · precision ${a.fatal_precision}`:'label some calls'}</s></div>
   <div class="tile bad"><s>Fatal rate</s><b>${s.fatal_pct}%</b><s>${s.fatal} calls</s></div>
   <div class="tile ok"><s>Sales-ready found</s><b>${s.sales_ready}</b><s>per ${s.audited} audited</s></div>
   <div class="tile"><s>Persona switches</s><b>${s.switches}</b><s>logged in live calls</s></div>
   <div class="tile ${ttf.length?'ok':''}"><s>Time to tested fix</s><b>${ttf.length?Math.round(Math.min(...ttf))+' min':'—'}</b><s>${s.promoted} promoted of ${s.fixes} fixes</s></div>
   <div class="tile"><s>Cost per audited call</s><b>$${s.cost_per_call_usd}</b><s>total $${s.cost_usd}</s></div>
   <div class="tile"><s>Queues</s><b>${(s.queues.risk||0)+(s.queues.presales||0)}</b><s>risk ${s.queues.risk||0} · pre-sales ${s.queues.presales||0} · callbacks ${s.queues.callback||0}</s></div>
  </div>
  <h2>The trail</h2><div class="card"><div class="trail"><span class="on">audit every call</span><span class="on">flag risk + sales-ready</span><span class="on">cluster root causes</span><span class="on">rank by impact</span><span class="on">propose fix (diff)</span><span>human approves</span><span>test on slice</span><span>promote</span></div>
  <div class="muted">Grader: Claude Sonnet 5 · Fix proposer: Gemini 3.6 Flash (never the grader) · Promotion pushes the prompt to the Sarvam agent.</div></div>
  <div class="row"><button class="btn p" onclick="recluster()">Re-cluster root causes</button><a class="btn" href="#/causes">Open causes →</a></div>`}

async function calls(){const r=await api('/calls');return `<h2>Calls (${r.length})</h2><div class="card"><table><tr><th>id</th><th>src</th><th>var</th><th>auto</th><th>human</th><th>reason</th><th>flags</th><th>sales</th></tr>
 ${r.map(c=>`<tr class="clk" onclick="openCall('${c.id}')"><td class="mono">${c.id}</td><td>${c.source||''}</td><td>${c.variant||''}</td><td>${grade(c.grade)}</td><td>${grade(c.human_grade)}</td><td>${esc(c.reason||'')}</td><td>${(JSON.parse(c.flags||'[]')).map(f=>`<span class="pill w">${f}</span>`).join(' ')}</td><td>${c.sales_ready?'<span class="pill sr">ready</span>':''}</td></tr>`).join('')}</table></div><div id="calldetail"></div>`}
async function openCall(id){const c=await api('/calls/'+id);const a=c.audit||{};$('#calldetail').innerHTML=`<div class="card"><div class="row"><b>${id}</b>${grade(a.grade)} ${a.human_grade?'human: '+grade(a.human_grade):''} <span class="muted">conf ${a.confidence??''}</span>
 <span style="flex:1"></span><button class="btn sm" onclick="hg('${id}','Fatal')">mark Fatal</button><button class="btn sm" onclick="hg('${id}','Non-Fatal')">mark Non-Fatal</button></div>
 <div class="muted" style="margin:6px 0">${esc(a.reason||'')} ${a.failure_turn>=0?'· turn '+a.failure_turn:''}${a.sales_reason?' · sales: '+esc(a.sales_reason):''}</div>
 ${c.switches.length?`<div class="muted">switches: ${c.switches.map(s=>s.signal).join(', ')}</div>`:''}
 <div class="t">${esc(c.transcript)}</div></div>`;$('#calldetail').scrollIntoView({behavior:'smooth'})}
async function hg(id,g){await post('/calls/'+id+'/human_grade',{grade:g});toast('labelled');render()}

async function causes(){const r=await api('/causes');const max=Math.max(1,...r.map(c=>c.impact));return `<h2>Root causes, ranked by impact (count × severity)</h2>
 ${r.length?r.map((c,i)=>`<div class="card"><div class="row"><b>${i+1}. ${esc(c.name)}</b><span class="pill fatal">${c.fatal_count} fatal</span><span class="pill">${c.count} calls</span><span class="pill">impact ${c.impact}</span><span style="flex:1"></span>
  ${c.fixes.length?`<span class="pill sr">${c.fixes[0].status}</span>`:''}<button class="btn p sm" onclick="propose('${c.id}')">Propose fix</button></div>
  <div class="bar" style="margin:8px 0"><i style="width:${c.impact/max*100}%"></i></div><div class="muted">${esc(c.description||'')}</div>
  <details><summary class="muted">example calls</summary>${JSON.parse(c.examples||'[]').map(id=>`<a href="#/calls" onclick="setTimeout(()=>openCall('${id}'),300)" class="pill">${id}</a> `).join('')}</details></div>`).join(''):'<div class="card muted">No causes yet — grade calls, then Re-cluster on the overview.</div>'}`}
async function propose(cid){toast('proposing…');const f=await post('/causes/'+cid+'/propose');toast('fix proposed');location.hash='#/fixes'}
async function recluster(){toast('clustering…');await post('/audit/cluster');toast('done');render()}

async function fixes(){const r=await api('/fixes');return `<h2>Fixes</h2>${r.length?r.map(f=>{const m=JSON.parse(f.rationale||'{}');return `<div class="card"><div class="row"><b>${esc(f.cause||'')}</b><span class="pill ${f.status==='promoted'?'nf':f.status==='rejected'?'fatal':'sr'}">${f.status}</span><span class="pill">${m.kind||''}</span><span class="muted">${f.created}</span><span style="flex:1"></span>
  ${f.status==='proposed'?`<button class="btn p sm" onclick="approve('${f.id}')">Approve → test 10%</button><button class="btn sm" onclick="rejectf('${f.id}')">Reject</button>`:''}
  ${f.status==='testing'||f.status==='approved'?`<button class="btn p sm" onclick="promote('${f.id}')">Promote to all traffic</button>`:''}</div>
  <div style="margin:6px 0"><b>${esc(m.summary||'')}</b><div class="muted">${esc(m.rationale||'')}</div><div class="muted">test: ${esc(m.test||'')}</div></div>
  <details open><summary class="muted">diff</summary><pre>${diffHtml(f.prompt_diff||'')}</pre></details></div>`}).join(''):'<div class="card muted">No fixes yet — propose one from a root cause.</div>'}`}
async function approve(id){const r=await post('/fixes/'+id+'/approve',{share:0.1,window_min:120});toast('approved · experiment '+r.experiment);render()}
async function rejectf(id){await post('/fixes/'+id+'/reject');toast('rejected');render()}
async function promote(id){const r=await post('/fixes/'+id+'/promote');toast('promoted v'+r.version+(r.sarvam&&!r.sarvam.error?' · pushed to Sarvam':' · (Sarvam not configured)'));render()}

async function experiments(){const r=await api('/experiments');return `<h2>Experiments (A = current, B = fix)</h2>${r.length?r.map(e=>{const t=e.test||{};return `<div class="card"><div class="row"><b>${e.id}</b><span class="pill">fix ${e.fix_id}</span><span class="pill">${Math.round(e.share*100)}% slice</span><span class="pill ${e.decision==='promote'?'nf':e.decision?'fatal':'sr'}">${e.decision||'running'}</span></div>
  <div class="grid2" style="margin-top:8px"><div><h3>A · current</h3><b style="font-size:26px">${t.a_rate!=null?Math.round(t.a_rate*100)+'%':'—'}</b> <span class="muted">bad · ${e.a_bad}/${e.a_calls}</span></div><div><h3>B · fixed</h3><b style="font-size:26px">${t.b_rate!=null?Math.round(t.b_rate*100)+'%':'—'}</b> <span class="muted">bad · ${e.b_bad}/${e.b_calls}</span></div></div>
  <div class="muted" style="margin-top:6px">${t.p_value!=null?`z ${t.z} · p ${t.p_value}`:'no data yet'} ${e.decision?'':'· need ≥20 each for a decision'}</div>
  <div class="row" style="margin-top:8px"><span class="muted">simulate:</span><button class="btn sm" onclick="rec('${e.id}','A',true)">A bad</button><button class="btn sm" onclick="rec('${e.id}','A',false)">A ok</button><button class="btn sm" onclick="rec('${e.id}','B',true)">B bad</button><button class="btn sm" onclick="rec('${e.id}','B',false)">B ok</button>
  ${!e.decision?`<span style="flex:1"></span><button class="btn p sm" onclick="fin('${e.id}','promote')">Decide: promote</button><button class="btn d sm" onclick="fin('${e.id}','stop_worse')">Stop: worse</button>`:''}</div></div>`}).join(''):'<div class="card muted">No experiments — approve a fix.</div>'}`}
async function rec(id,v,bad){await post('/experiments/'+id+'/record',{variant:v,bad});render()}
async function fin(id,d){await post('/experiments/'+id+'/finish',{decision:d});toast(d);render()}

async function queues(){const [risk,pre,cb]=await Promise.all([api('/queue/risk'),api('/queue/presales'),api('/queue/callback')]);
  const tbl=(rows,title)=>`<h2>${title} (${rows.length})</h2><div class="card">${rows.length?`<table><tr><th>when</th><th>call</th><th>glid</th><th>reason</th><th></th></tr>${rows.map(q=>`<tr><td class="muted">${q.created}</td><td>${q.call_id||''}</td><td>${q.glid||''}</td><td>${esc(q.reason)}</td><td><button class="btn sm" onclick="handle('${q.id}')">handled</button></td></tr>`).join('')}</table>`:'<span class="muted">empty</span>'}</div>`;
  return tbl(risk,'Risk — review')+tbl(pre,'Pre-sales — hand to sales')+tbl(cb,'Callbacks booked')}
async function handle(id){await post('/queue/'+id+'/handle');render()}

async function prompt(){const r=await api('/prompt');return `<h2>Agent prompt</h2><div class="card"><div class="muted">versions: ${r.versions.map(v=>`v${v.version}${v.active?' (active)':''}`).join(', ')||'file only'}</div><pre>${esc(r.prompt)}</pre></div>`}

async function render(){nav();$('#hdr').textContent=new Date().toLocaleTimeString();try{$('#m').innerHTML=await ({overview,calls,causes,fixes,experiments,queues,prompt})[view]()}catch(e){$('#m').innerHTML=`<div class="card">${esc(e.message)}</div>`}}
addEventListener('hashchange',()=>{view=location.hash.slice(2)||'overview';render()});render();setInterval(()=>{if(view==='overview'||view==='experiments')render()},15000);
</script></body></html>
